name: neniu-verify

services:
  appserver:
    type: php:8.3
    via: apache:2.4
    webroot: public
    ssl: true
    composer_version: '2'
    config:
      php: .lando/php.ini
    build:
      - composer install --no-interaction
      - composer check-platform-reqs

  node:
    type: node:24
    port: 5173
    ssl: true
    sslExpose: false
    scanner: false
    overrides:
      environment:
        npm_config_cache: /app/.lando/npm-cache
        VITE_HOST: 0.0.0.0
        VITE_DEV_ORIGIN: https://vite-neniu-verify.lndo.site
        VITE_BACKEND_ORIGIN: https://neniu-verify.lndo.site
    build:
      - npm ci --prefer-offline --no-audit --no-fund --loglevel=info --fetch-timeout=30000 --fetch-retries=1

proxy:
  appserver:
    - neniu-verify.lndo.site
  node:
    - vite-neniu-verify.lndo.site:5173

tooling:
  node:
    service: node
  npm:
    service: node
  php:
    service: appserver
  composer:
    service: appserver
  lint:
    service: appserver
    cmd: composer lint
  cs:
    service: appserver
    cmd: composer cs
  cs-fix:
    service: appserver
    cmd: composer cs:fix
